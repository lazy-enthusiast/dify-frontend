<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hobby Project</title>

<!-- 第三方套件：marked & purify -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

<!-- Highlight.js 語法高亮 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- KaTeX 數學公式渲染 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff; --sidebar-bg: #f7f7f8; --border: #e5e5e5; --text: #222; --text-light: #777;
    --hover: #ececec; --active: #e3e3e3; --user-bg: #2563eb; --user-text: #fff;
    --bot-bg: #f1f1f1; --bot-text: #222; --error-bg: #fde2e2; --error-text: #b42318;
    --input-border: #ddd; --accent: #2563eb; --code-bg: #282c34;
  }
  body.dark {
    --bg: #1e1f22; --sidebar-bg: #17181a; --border: #33343a; --text: #e6e6e6; --text-light: #9a9a9a;
    --hover: #2a2b2f; --active: #34363b; --user-bg: #3b82f6; --user-text: #fff;
    --bot-bg: #2a2b2f; --bot-text: #e6e6e6; --error-bg: #4a2323; --error-text: #ff9a9a;
    --input-border: #44454a; --accent: #3b82f6; --code-bg: #282c34;
  }
  body { margin: 0; font-family: -apple-system, sans-serif; display: flex; height: 100vh; background: var(--bg); color: var(--text); }
  #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px; }
  #topRow { display: flex; gap: 6px; margin-bottom: 8px; }
  #newChatBtn { flex: 1; padding: 10px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; font-size: 14px; }
  #themeBtn { padding: 10px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; font-size: 14px; }
  #searchBox { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--bg); color: var(--text); font-size: 13px; margin-bottom: 8px; }
  #convList { overflow-y: auto; flex: 1; }
  .convItem { position: relative; display: flex; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  .convItem:hover { background: var(--hover); }
  .convItem.active { background: var(--active); }
  .convTitle { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .moreBtn { padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text-light); }
  .moreBtn:hover { background: var(--active); }
  .menu { position: absolute; right: 8px; top: 36px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 10; overflow: hidden; }
  .menu div { padding: 8px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--text); }
  .menu div:hover { background: var(--hover); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  #topbar label { font-size: 13px; color: var(--text-light); }
  #modelSelect { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--input-border); background: var(--bg); color: var(--text); font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msgWrap { max-width: 72%; margin-bottom: 18px; display: flex; flex-direction: column; }
  .msgWrap.user { margin-left: auto; align-items: flex-end; }
  .msgWrap.bot, .msgWrap.error { margin-right: auto; align-items: flex-start; }
  .msgContent { padding: 10px 14px; border-radius: 12px; line-height: 1.6; word-break: break-word; }
  .msgWrap.user .msgContent { background: var(--user-bg); color: var(--user-text); white-space: pre-wrap; }
  .msgWrap.bot .msgContent { background: var(--bot-bg); color: var(--bot-text); }
  .msgWrap.error .msgContent { background: var(--error-bg); color: var(--error-text); }
  .msgContent p { margin: 0 0 8px; }
  .msgContent p:last-child { margin-bottom: 0; }
  .msgContent ul, .msgContent ol { margin: 4px 0 8px 20px; }

  /* 程式碼區塊高亮與按鈕樣式 */
  .codeBlockContainer { position: relative; margin: 8px 0; border-radius: 6px; overflow: hidden; background: var(--code-bg); }
  .codeBlockHeader { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 4px 12px; font-size: 12px; color: #abb2bf; font-family: monospace; }
  .codeCopyBtn { border: none; background: transparent; color: #abb2bf; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .codeCopyBtn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .msgContent pre { margin: 0; padding: 12px; overflow-x: auto; background: var(--code-bg); }
  .msgContent code { font-family: 'Fira Code', Consolas, Monaco, monospace; font-size: 13px; }

  .msgMeta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--text-light); }
  .msgMeta button { border: none; background: none; cursor: pointer; color: var(--text-light); font-size: 12px; padding: 2px 4px; border-radius: 4px; }
  .msgMeta button:hover { background: var(--hover); color: var(--text); }
  #inputBar { display: flex; padding: 16px; border-top: 1px solid var(--border); gap: 8px; }
  #uploadBtn { 
    width: 42px; 
    height: 42px; 
    padding: 0; 
    border: 1px solid var(--input-border); 
    border-radius: 8px; 
    background: var(--bg); 
    color: var(--text); 
    cursor: pointer; 
    font-size: 18px; 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0; 
    align-self: flex-end;
  }
  #uploadBtn:hover { background: var(--hover); }
 #inputBox { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--bg); color: var(--text); font-size: 14px; resize: none; max-height: 160px; overflow-y: auto; font-family: inherit; }
  #sendBtn { padding: 0 20px; border: none; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="topRow">
    <button id="newChatBtn" onclick="newConversation()">+ 新對話</button>
    <button id="themeBtn" onclick="toggleTheme()" title="切換深色模式">🌓</button>
  </div>
  <input id="searchBox" placeholder="搜尋對話..." oninput="renderSidebar()">
  <div id="convList"></div>
</div>

<div id="main">
  <div id="topbar">
    <label for="modelSelect">AI 模型：</label>
    <select id="modelSelect" onchange="changeModel()">
      <option value="auto" selected>🤖 Auto (智能分流)</option> 
      <option value="Sonnet-5">Sonnet-5</option>
      <option value="4o">4o</option>
      <option value="o3-mini">o3-mini</option>
    </select>
  </div>
  <div id="messages"></div>
  <div id="inputBar">
    <input type="file" id="fileInput" style="display: none !important;" onchange="handleFileUpload(event)">
    <button type="button" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="上傳檔案">📎</button>
    <textarea id="inputBox" rows="1" placeholder="輸入你的問題..."></textarea>
    <button type="button" id="sendBtn" onclick="sendMessage()">送出</button>
  </div>
</div>

<script>
const WORKER_URL = 'https://proud-water.davchan-clp.workers.dev';
const NAME = 'superfancyriceballs';

let conversations = JSON.parse(localStorage.getItem('conversations') || '[]');
let activeId = null;
let openMenuId = null;

if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

function saveConversations() {
  localStorage.setItem('conversations', JSON.stringify(conversations));
}

function getActiveConv() {
  return conversations.find(c => c.id === activeId);
}

function touchConversation(id) {
  const idx = conversations.findIndex(c => c.id === id);
  if (idx > 0) {
    const [c] = conversations.splice(idx, 1);
    conversations.unshift(c);
  }
}

function newConversation() {
  const conv = {
    id: Date.now().toString(),
    title: '新對話',
    model: 'auto',
    historySummary: '',
    lastAiResponse: '',
    lastQuery: '',
    messages: []
  };
  conversations.unshift(conv);
  activeId = conv.id;
  openMenuId = null;
  saveConversations();
  renderSidebar();
  renderMessages();
}

function changeModel() {
  const conv = getActiveConv();
  if (!conv) return;
  conv.model = document.getElementById('modelSelect').value;
  saveConversations();
}

function renderSidebar() {
  const keyword = document.getElementById('searchBox').value.trim().toLowerCase();
  const list = document.getElementById('convList');
  list.innerHTML = '';

  const filtered = conversations.filter(c => {
    if (!keyword) return true;
    if (c.title.toLowerCase().includes(keyword)) return true;
    return c.messages.some(m => m.text.toLowerCase().includes(keyword));
  });

  filtered.forEach(c => {
    const item = document.createElement('div');
    item.className = 'convItem' + (c.id === activeId ? ' active' : '');

    const title = document.createElement('div');
    title.className = 'convTitle';
    title.textContent = c.title;
    title.onclick = () => { activeId = c.id; openMenuId = null; renderSidebar(); renderMessages(); };
    item.appendChild(title);

    const moreBtn = document.createElement('div');
    moreBtn.className = 'moreBtn';
    moreBtn.textContent = '⋯';
    moreBtn.onclick = (e) => { e.stopPropagation(); openMenuId = (openMenuId === c.id ? null : c.id); renderSidebar(); };
    item.appendChild(moreBtn);

    if (openMenuId === c.id) {
      const menu = document.createElement('div');
      menu.className = 'menu';
      const renameOpt = document.createElement('div');
      renameOpt.textContent = '重新命名';
      renameOpt.onclick = (e) => {
        e.stopPropagation();
        const newTitle = prompt('新的對話名稱：', c.title);
        openMenuId = null;
        if (newTitle && newTitle.trim()) { c.title = newTitle.trim(); saveConversations(); }
        renderSidebar();
      };
      const delOpt = document.createElement('div');
      delOpt.textContent = '刪除對話';
      delOpt.onclick = (e) => {
        e.stopPropagation();
        openMenuId = null;
        if (confirm('確定要刪除這個對話嗎？')) {
          conversations = conversations.filter(x => x.id !== c.id);
          if (activeId === c.id) { activeId = conversations[0]?.id || null; }
          saveConversations();
          renderSidebar();
          renderMessages();
        } else { renderSidebar(); }
      };
      menu.appendChild(renameOpt);
      menu.appendChild(delOpt);
      item.appendChild(menu);
    }

    list.appendChild(item);
  });
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}

// 💡 強化：Markdown 解析 + Highlight.js 高亮 + KaTeX 數學公式
function renderMarkdownAndFeatures(container, text) {
  const rawHtml = marked.parse(text);
  const cleanHtml = DOMPurify.sanitize(rawHtml);
  container.innerHTML = cleanHtml;

  // 1. KaTeX 數學公式自動渲染
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  }

  // 2. Highlight.js 高亮與一鍵複製程式碼
  container.querySelectorAll('pre code').forEach((codeBlock) => {
    hljs.highlightElement(codeBlock);

    const pre = codeBlock.parentElement;
    if (pre.parentElement.classList.contains('codeBlockContainer')) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'codeBlockContainer';

    const lang = (codeBlock.className.match(/language-(\w+)/) || [])[1] || 'code';
    const header = document.createElement('div');
    header.className = 'codeBlockHeader';
    header.innerHTML = `<span>${lang}</span>`;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'codeCopyBtn';
    copyBtn.textContent = '複製程式碼';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(codeBlock.innerText).then(() => {
        copyBtn.textContent = '✓ 已複製';
        setTimeout(() => copyBtn.textContent = '複製程式碼', 1500);
      });
    };
    header.appendChild(copyBtn);

    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = '✓ 已複製';
    setTimeout(() => { btn.textContent = old; }, 1200);
  });
}

function buildMessageEl(m, conv) {
  const wrap = document.createElement('div');
  wrap.className = 'msgWrap ' + m.role;

  const content = document.createElement('div');
  content.className = 'msgContent';
  if (m.role === 'bot') {
    renderMarkdownAndFeatures(content, m.text);
  } else {
    content.textContent = m.text;
  }
  wrap.appendChild(content);

  const meta = document.createElement('div');
  meta.className = 'msgMeta';

  const time = document.createElement('span');
  time.textContent = formatTime(m.time);
  meta.appendChild(time);

  if (m.usedModel) {
    const modelTag = document.createElement('span');
    modelTag.style.opacity = '0.8';
    modelTag.textContent = `• 🤖 ${m.usedModel}`;
    meta.appendChild(modelTag);
  }

  if (m.role !== 'error') {
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '⧉ 複製';
    copyBtn.onclick = () => copyText(m.text, copyBtn);
    meta.appendChild(copyBtn);
  }

  if (m.role === 'error') {
    const retryBtn = document.createElement('button');
    retryBtn.textContent = '↻ 重新送出';
    retryBtn.onclick = () => {
      wrap.remove();
      conv.messages = conv.messages.filter(x => x !== m);
      sendMessage(conv.lastQuery);
    };
    meta.appendChild(retryBtn);
  }

  wrap.appendChild(meta);
  return wrap;
}

function renderMessages() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  const conv = getActiveConv();
  if (!conv) return;
  document.getElementById('modelSelect').value = conv.model || 'auto';
  conv.messages.forEach(m => box.appendChild(buildMessageEl(m, conv)));
  box.scrollTop = box.scrollHeight;
}

function typewriterInto(contentEl, fullText, onDone) {
  const box = document.getElementById('messages');
  const stepsCount = Math.max(20, Math.min(fullText.length, 100));
  const chunkSize = Math.ceil(fullText.length / stepsCount);
  const intervalMs = 700 / stepsCount;
  let i = 0;
  contentEl.textContent = '';
  const timer = setInterval(() => {
    i += chunkSize;
    contentEl.textContent = fullText.slice(0, i);
    box.scrollTop = box.scrollHeight;
    if (i >= fullText.length) {
      clearInterval(timer);
      onDone();
    }
  }, intervalMs);
}

// 💡 背景非同步請求 AI 自動生成 3~5 字標題
async function fetchAutoTitle(conv, userQuery, aiAnswer) {
  try {
    // 防護：若 userQuery 太長（例如檔案內容），截斷前 100 字傳給後端生成標題
    const cleanQuery = (userQuery || '').slice(0, 100);
    const cleanAnswer = (aiAnswer || '').slice(0, 200);

    console.log('🚀 開始請求生成標題...', { cleanQuery });
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-App-Auth': NAME
      },
      body: JSON.stringify({
        action: 'generateTitle',
        query: cleanQuery,
        lastAiResponse: cleanAnswer
      })
    });
    const data = await res.json();
    console.log('📦 Worker 回傳標題結果:', data);

    if (data.title) {
      conv.title = data.title;
      saveConversations();
      renderSidebar();
    }
  } catch (e) {
    console.error('❌ 標題生成失敗/跳過:', e);
  }
}

const inputBox = document.getElementById('inputBox');
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
});

let attachedFileContent = '';
let attachedFileName = '';

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const MAX_SIZE = 10 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    alert(`檔案太大囉！(${Math.round(file.size / (1024 * 1024))} MB)\n為了免費配額安全，請上傳小於 10MB 的檔案。`);
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    attachedFileContent = e.target.result;
    attachedFileName = file.name;
    alert(`已載入檔案：${file.name} (${Math.round(file.size / 1024)} KB)`);
  };

  reader.readAsText(file);
  event.target.value = '';
}

async function sendMessage(overrideText) {
  let text = (overrideText !== undefined ? overrideText : inputBox.value.trim());

  if (attachedFileContent) {
    text = `${text}\n\n【附加檔案: ${attachedFileName}】\n\`\`\`\n${attachedFileContent}\n\`\`\``;
    attachedFileContent = '';
    attachedFileName = '';
  }
  if (!text) return;
  let conv = getActiveConv();
  if (!conv) { newConversation(); conv = getActiveConv(); }

  const isFirstMessage = conv.messages.length === 0;
  const rawText = overrideText !== undefined ? overrideText : inputBox.value.trim(); // 保存未附加檔案的純文字

  conv.lastQuery = text;
  conv.messages.push({ role: 'user', text, time: Date.now() });
  if (isFirstMessage) conv.title = text.slice(0, 15) + '...';
  if (overrideText === undefined) { inputBox.value = ''; inputBox.style.height = 'auto'; }
  touchConversation(conv.id);
  renderSidebar();
  renderMessages();

  const botMsg = { role: 'bot', text: '', time: Date.now() };
  conv.messages.push(botMsg);
  renderMessages();
  const box = document.getElementById('messages');
  const lastContentEl = box.lastElementChild.querySelector('.msgContent');
  lastContentEl.textContent = '思考中...';

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-App-Auth': NAME
      },
      body: JSON.stringify({
        query: text,
        historySummary: conv.historySummary,
        lastAiResponse: conv.lastAiResponse,
        model: conv.model
      })
    });
    const data = await res.json();

    if (data.answer) {
      botMsg.text = data.answer;
      if (data.usedModel) botMsg.usedModel = data.usedModel;
      conv.historySummary = data.historySummary || conv.historySummary;
      conv.lastAiResponse = data.answer;
      typewriterInto(lastContentEl, data.answer, () => {
        renderMarkdownAndFeatures(lastContentEl, data.answer);
        saveConversations();
        renderMessages();

        // 💡 第一輪對話完成後，背景請求生成精煉標題
        if (isFirstMessage) {
          fetchAutoTitle(conv, rawText, data.answer);
        }
      });
    } else {
      conv.messages[conv.messages.length - 1] = { role: 'error', text: '發生錯誤：' + JSON.stringify(data), time: Date.now() };
      saveConversations();
      renderMessages();
    }
  } catch (err) {
    conv.messages[conv.messages.length - 1] = { role: 'error', text: '連線失敗：' + err.message, time: Date.now() };
    saveConversations();
    renderMessages();
  }
}

inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

if (conversations.length === 0) newConversation();
else { activeId = conversations[0].id; renderSidebar(); renderMessages(); }
</script>
</body>
</html>
