<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Dify App</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, sans-serif; display: flex; height: 100vh; }
  #sidebar { width: 260px; background: #f7f7f8; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; padding: 12px; }
  #newChatBtn { padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; margin-bottom: 12px; font-size: 14px; }
  #convList { overflow-y: auto; flex: 1; }
  .convItem { position: relative; display: flex; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  .convItem:hover { background: #ececec; }
  .convItem.active { background: #e3e3e3; }
  .convTitle { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .moreBtn { padding: 4px 8px; border-radius: 6px; cursor: pointer; color: #666; }
  .moreBtn:hover { background: #ddd; }
  .menu { position: absolute; right: 8px; top: 36px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; overflow: hidden; }
  .menu div { padding: 8px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .menu div:hover { background: #f2f2f2; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #topbar { padding: 10px 16px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 8px; }
  #topbar label { font-size: 13px; color: #666; }
  #modelSelect { padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 70%; margin-bottom: 16px; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: #2563eb; color: white; margin-left: auto; }
  .msg.bot { background: #f1f1f1; color: #222; margin-right: auto; }
  .msg.error { background: #fde2e2; color: #b42318; margin-right: auto; }
  #inputBar { display: flex; padding: 16px; border-top: 1px solid #e5e5e5; gap: 8px; }
  #inputBox { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; resize: none; }
  #sendBtn { padding: 0 20px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
</style>
</head>
<body>
﻿
<div id="sidebar">
  <button id="newChatBtn" onclick="newConversation()">+ 新對話</button>
  <div id="convList"></div>
</div>
﻿
<div id="main">
  <div id="topbar">
    <label for="modelSelect">AI 模型：</label>
    <select id="modelSelect" onchange="changeModel()">
      <option value="Sonnet-5">Sonnet-5</option>
      <option value="4o">4o</option>
      <option value="o3-mini">o3-mini</option>
    </select>
  </div>
  <div id="messages"></div>
  <div id="inputBar">
    <textarea id="inputBox" rows="1" placeholder="輸入你的問題..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">送出</button>
  </div>
</div>
﻿
